 <!DOCTYPE html>
<html>
<head>
<title>Page Title</title>

<script>

function loanCalc() {
    let PV = document.getElementById("total").value;
    let r = document.getElementById("apr").value;
    let n = document.getElementById("years").value;
    let P = ((r/100/12) * PV) / (1-(1+(r/100/12))**-(n*12));
    let ans = P.toFixed(2);
    document.getElementById("monthly").innerHTML = ans;
}
  
</script>
  
</head>
<body>

<p>
    Loan Amount = <input id="total"> <br>
    Annual Interest Rate = <input id="apr"> <br>
    Years of Payments = <input id="years"> <br>
  
    <button onclick="loanCalc()"> Calculate Monthly Payment </button>
</p>

<p>
    If you have a $<span id="PV"> [] </span> for <span id="n"> [] </span> years at <span id="r"> [] </span>% interest, your monthly payment is $<span id="monthly"> [] </span>
</p>

<script>
  
</script>

</body>
</html>
